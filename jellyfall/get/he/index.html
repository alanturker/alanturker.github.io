<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jellyfall: Block Puzzle Game</title>
  <meta name="description" content="אתם יכולים לנצח אותי? Jellyfall · App Store ו-Google Play">
  <meta property="og:title" content="Jellyfall: Block Puzzle Game">
  <meta property="og:description" content="אתם יכולים לנצח אותי? App Store ו-Google Play">
  <meta property="og:image" content="https://alanturker.github.io/jellyfall/get/icon.png">
  <meta property="og:url" content="https://alanturker.github.io/jellyfall/get/he/">
  <meta property="og:type" content="website">
  <meta name="apple-itunes-app" content="app-id=6818504593">
  <script>
    // Akıllı davet bağlantısı: iPhone/iPad → App Store, Android → Google Play.
    // Diğer cihazlarda (masaüstü) iki düğmeli sayfa görünür.
    (function () {
      var IOS = 'https://apps.apple.com/app/id6818504593';
      var PKG = 'com.alanturker.jellyfall';
      var src = (new URLSearchParams(location.search).get('s') || 'web').replace(/[^a-z0-9_]/gi, '').slice(0, 20);
      var ref = encodeURIComponent('utm_source=' + src + '&utm_medium=share&utm_campaign=invite');
      var PLAY = 'https://play.google.com/store/apps/details?id=' + PKG + '&referrer=' + ref;
      window.JF = { ios: IOS, play: PLAY };
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      if (isIOS) location.replace(IOS);
      else if (isAndroid) location.replace(PLAY);
    })();
  </script>
  <style>
    :root { color-scheme: dark; --bg: #17122b; --ink: #f6f1ff; --muted: #bdb3d6; --accent: #ff7ad9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, #3a1f7a, var(--bg) 70%); color: var(--ink);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    main { padding: 2rem 1rem; max-width: 26rem; }
    img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px #0006; }
    h1 { margin: 1rem 0 .3rem; font-size: 1.8rem; }
    p { color: var(--muted); margin: 0 0 1.6rem; }
    .btns { display: flex; flex-direction: column; gap: .8rem; }
    a.b { display: block; padding: .9rem 1rem; border-radius: 16px; font-weight: 700; text-decoration: none; color: #fff; }
    a.ios { background: #2b6cff; box-shadow: 0 4px 0 #1b47b0; }
    a.and { background: #2fd49a; box-shadow: 0 4px 0 #1c9a6e; }
  </style>
</head>
<body>
  <main>
    <img src="../icon.png" alt="Jellyfall">
    <h1>Jellyfall</h1>
    <p>אתם יכולים לנצח אותי?</p>
    <div class="btns">
      <a class="b ios" id="ios" href="https://apps.apple.com/app/id6818504593">App Store</a>
      <a class="b and" id="and" href="https://play.google.com/store/apps/details?id=com.alanturker.jellyfall">Google Play</a>
    </div>
  </main>
  <script>
    document.getElementById('ios').href = JF.ios;
    document.getElementById('and').href = JF.play;
  </script>
</body>
</html>
