<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapAddict</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1115;
      --ink: #f4f1ea;
      --muted: #b7b1a4;
      --line: #2a2d35;
      --accent: #ffd36a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f3ec;
        --ink: #16181d;
        --muted: #5b574e;
        --line: #d8d2c6;
        --accent: #8a5a00;
      }
    }
    body {
      margin: 0;
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main { max-width: 36rem; margin: 0 auto; padding: 3rem 1.25rem; }
    h1 { margin: 0 0 0.5rem; }
    p { color: var(--muted); }
    a { color: var(--accent); }
    ul { padding-left: 1.2rem; }
  </style>
</head>

    <p>A tap arcade with boards, friends, encounters and waged duels.</p>
